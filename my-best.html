<style>
  :root {
    --ink: #1c2321;
    --ink-soft: #55605a;
    --ink-faint: #8b958e;
    --paper: #eef1ed;
    --surface: #ffffff;
    --surface-2: #e2e7e0;
    --border: #d4dbd0;
    --accent: #1f6f5c;
    --accent-ink: #ffffff;
    --accent-soft: #dbe8e2;
    --gold: #b8863a;
    --gold-soft: #f3e3c4;
    --silver: #7c868d;
    --silver-soft: #e6e9eb;
    --bronze: #a15f34;
    --bronze-soft: #ecd9c7;
    --book: #3c6e8f;
    --book-soft: #dbe6ec;
    --movie: #b8463d;
    --movie-soft: #f2ded9;
    --youtube: #7d4f95;
    --youtube-soft: #e6dcec;
    --tv: #74812f;
    --tv-soft: #e2e6ce;
    --game: #5568c9;
    --game-soft: #dde1f5;
    --radio: #a2467c;
    --radio-soft: #f0dde8;
    --other: #6b6357;
    --other-soft: #e6e2d8;
    --danger: #b8463d;
    --shadow: 0 10px 30px rgba(28, 35, 33, 0.10);
    --shadow-lg: 0 20px 50px rgba(28, 35, 33, 0.22);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #eef1ec;
      --ink-soft: #aab3ac;
      --ink-faint: #6d766f;
      --paper: #131614;
      --surface: #1c211e;
      --surface-2: #262c28;
      --border: #343b36;
      --accent: #57b79c;
      --accent-ink: #0c1512;
      --accent-soft: #203029;
      --gold: #d9ab5c;
      --gold-soft: #3a2f1a;
      --silver: #a4adb2;
      --silver-soft: #2b2e30;
      --bronze: #c9895a;
      --bronze-soft: #3a2a1c;
      --book: #7fb2d6;
      --book-soft: #1e2c34;
      --movie: #e0847a;
      --movie-soft: #35201d;
      --youtube: #bb96d1;
      --youtube-soft: #2c2333;
      --tv: #b9c97e;
      --tv-soft: #2a3020;
      --game: #a9b4ee;
      --game-soft: #232a44;
      --radio: #d98cbc;
      --radio-soft: #3a2430;
      --other: #b9b2a0;
      --other-soft: #2c2921;
      --danger: #e0847a;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.55);
    }
  }
  :root[data-theme="dark"] {
    --ink: #eef1ec;
    --ink-soft: #aab3ac;
    --ink-faint: #6d766f;
    --paper: #131614;
    --surface: #1c211e;
    --surface-2: #262c28;
    --border: #343b36;
    --accent: #57b79c;
    --accent-ink: #0c1512;
    --accent-soft: #203029;
    --gold: #d9ab5c;
    --gold-soft: #3a2f1a;
    --silver: #a4adb2;
    --silver-soft: #2b2e30;
    --bronze: #c9895a;
    --bronze-soft: #3a2a1c;
    --book: #7fb2d6;
    --book-soft: #1e2c34;
    --movie: #e0847a;
    --movie-soft: #35201d;
    --youtube: #bb96d1;
    --youtube-soft: #2c2333;
    --tv: #b9c97e;
    --tv-soft: #2a3020;
    --game: #a9b4ee;
    --game-soft: #232a44;
    --radio: #d98cbc;
    --radio-soft: #3a2430;
    --other: #b9b2a0;
    --other-soft: #2c2921;
    --danger: #e0847a;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .mincho { font-family: "Shippori Mincho", serif; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  button { font: inherit; color: inherit; }
  input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #app {
    max-width: 640px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block-end: 120px;
  }

  /* ---- Header ---- */
  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--paper);
    padding-block: 18px 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .app-name {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  .stats {
    text-align: right;
    color: var(--ink-soft);
    font-size: 0.78rem;
    line-height: 1.5;
  }
  .stats b { color: var(--ink); font-size: 0.95rem; }

  .chip-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-block: 10px 2px;
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip-group { display: flex; gap: 6px; flex: 0 0 auto; }
  .chip-divider { width: 1px; background: var(--border); flex: 0 0 auto; margin-block: 4px; }
  .chip {
    flex: 0 0 auto;
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 0.82rem;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
  }

  /* ---- List ---- */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .empty-note {
    color: var(--ink-soft);
    font-size: 0.85rem;
    padding: 6px 2px 14px;
    line-height: 1.7;
  }
  .sample-tag {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--ink-faint);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 6px;
    margin-left: 6px;
    vertical-align: 1px;
  }

  .row {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 11px 12px;
    text-align: left;
    cursor: pointer;
    width: 100%;
  }
  .row:active { background: var(--surface-2); }
  .rank {
    font-size: 1.15rem;
    font-weight: 700;
    text-align: center;
    color: var(--ink-soft);
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .rank[data-medal="1"] { background: var(--gold-soft); color: var(--gold); font-size: 1.3rem; }
  .rank[data-medal="2"] { background: var(--silver-soft); color: var(--silver); font-size: 1.22rem; }
  .rank[data-medal="3"] { background: var(--bronze-soft); color: var(--bronze); font-size: 1.22rem; }

  .row-main { min-width: 0; }
  .row-title {
    font-weight: 700;
    font-size: 0.98rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .tag {
    font-size: 0.68rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 5px;
    letter-spacing: 0.02em;
    flex: 0 0 auto;
  }
  .tag[data-type="book"] { background: var(--book-soft); color: var(--book); }
  .tag[data-type="movie"] { background: var(--movie-soft); color: var(--movie); }
  .tag[data-type="youtube"] { background: var(--youtube-soft); color: var(--youtube); }
  .tag[data-type="tv"] { background: var(--tv-soft); color: var(--tv); }
  .tag[data-type="game"] { background: var(--game-soft); color: var(--game); }
  .tag[data-type="radio"] { background: var(--radio-soft); color: var(--radio); }
  .tag[data-type="other"] { background: var(--other-soft); color: var(--other); }
  .row-date { font-size: 0.72rem; color: var(--ink-faint); }

  .row-score {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent);
    display: flex;
    align-items: baseline;
    gap: 1px;
  }
  .row-score span { font-size: 0.68rem; color: var(--ink-faint); font-weight: 500; }

  /* ---- FAB ---- */
  .fab {
    position: fixed;
    right: 20px;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    font-size: 1.7rem;
    box-shadow: var(--shadow-lg);
    cursor: pointer;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  /* ---- Sheet / overlay ---- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 11, 0.45);
    z-index: 40;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .sheet {
    background: var(--surface);
    width: 100%;
    max-width: 640px;
    max-height: min(88vh, 720px);
    overflow-y: auto;
    border-radius: 20px 20px 0 0;
    padding: 18px 18px calc(22px + env(safe-area-inset-bottom, 0px));
    box-shadow: var(--shadow-lg);
  }
  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 3px;
    margin: 0 auto 14px;
  }
  .sheet-title {
    font-size: 1.15rem;
    font-weight: 800;
    margin-bottom: 16px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }
  .field input[type="text"], .field input[type="date"], .field textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    background: var(--paper);
    color: var(--ink);
  }
  .field textarea { resize: vertical; min-height: 64px; }

  .type-select { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .type-btn {
    border: 1px solid var(--border);
    background: var(--paper);
    border-radius: 10px;
    padding: 10px 4px;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .type-btn[aria-pressed="true"][data-type="book"] { background: var(--book-soft); border-color: var(--book); color: var(--book); }
  .type-btn[aria-pressed="true"][data-type="movie"] { background: var(--movie-soft); border-color: var(--movie); color: var(--movie); }
  .type-btn[aria-pressed="true"][data-type="youtube"] { background: var(--youtube-soft); border-color: var(--youtube); color: var(--youtube); }
  .type-btn[aria-pressed="true"][data-type="tv"] { background: var(--tv-soft); border-color: var(--tv); color: var(--tv); }
  .type-btn[aria-pressed="true"][data-type="game"] { background: var(--game-soft); border-color: var(--game); color: var(--game); }
  .type-btn[aria-pressed="true"][data-type="radio"] { background: var(--radio-soft); border-color: var(--radio); color: var(--radio); }
  .type-btn[aria-pressed="true"][data-type="other"] { background: var(--other-soft); border-color: var(--other); color: var(--other); }

  .score-field {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .score-readout {
    font-size: 1.9rem;
    font-weight: 700;
    color: var(--accent);
    width: 76px;
    flex: 0 0 auto;
  }
  .score-readout span { font-size: 0.72rem; color: var(--ink-faint); font-weight: 500; }
  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 999px;
    background: var(--surface-2);
    outline-offset: 6px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--surface);
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--surface);
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-track {
    height: 6px;
    border-radius: 999px;
    background: var(--surface-2);
  }
  .score-presets { display: flex; gap: 6px; margin-top: 10px; }
  .score-preset {
    flex: 1;
    padding: 7px 0;
    border: 1px solid var(--border);
    background: var(--paper);
    border-radius: 8px;
    font-size: 0.76rem;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .sheet-actions { display: flex; gap: 10px; margin-top: 4px; }
  .btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-ghost { background: var(--surface-2); color: var(--ink); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }

  .detail-memo {
    background: var(--paper);
    border-radius: 10px;
    padding: 12px;
    font-size: 0.88rem;
    line-height: 1.7;
    color: var(--ink-soft);
    white-space: pre-wrap;
    margin-bottom: 16px;
    min-height: 30px;
  }
  .banner {
    font-size: 0.76rem;
    color: var(--ink-soft);
    background: var(--surface-2);
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 12px;
  }
</style>

<div id="app"></div>

<script>
(function () {
  "use strict";

  var TYPES = {
    book:    { label: "本",        color: "book" },
    movie:   { label: "映画",      color: "movie" },
    youtube: { label: "YouTube",   color: "youtube" },
    tv:      { label: "テレビ番組", color: "tv" },
    game:    { label: "ゲーム",    color: "game" },
    radio:   { label: "ラジオ",    color: "radio" },
    other:   { label: "その他",    color: "other" }
  };

  var state = {
    entries: null,      // null = loading, [] = empty, [...] = data
    usingFallback: false,
    filterType: "all",
    filterPeriod: "all",
    sheet: null         // {mode:'add'} | {mode:'edit', entry} | {mode:'view', entry}
  };

  var draft = { title: "", type: "book", date: todayStr(), score: 80, memo: "" };

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------------- storage layer ---------------- */
  var store = {
    async init(onChange) {
      var db = null;
      try {
        db = window.claude ? await window.claude.use("db") : null;
      } catch (e) { db = null; }

      if (db) {
        this._db = db;
        db.collection("entries").onSnapshot(
          function (snap) {
            var list = snap.docs.map(function (d) {
              return Object.assign({ id: d.id }, d.data());
            });
            onChange(list, false);
          },
          function () { store._fallbackInit(onChange); }
        );
        return;
      }
      this._fallbackInit(onChange);
    },
    _fallbackInit(onChange) {
      state.usingFallback = true;
      this._local = readLocal();
      onChange(this._local.slice(), true);
      this._onChange = onChange;
    },
    async add(data) {
      if (this._db) {
        await this._db.collection("entries").add(data);
        return;
      }
      var entry = Object.assign({ id: uid() }, data);
      this._local.unshift(entry);
      writeLocal(this._local);
      this._onChange(this._local.slice(), true);
    },
    async update(id, data) {
      if (this._db) {
        await this._db.collection("entries").doc(id).update(data);
        return;
      }
      this._local = this._local.map(function (e) {
        return e.id === id ? Object.assign({}, e, data) : e;
      });
      writeLocal(this._local);
      this._onChange(this._local.slice(), true);
    },
    async remove(id) {
      if (this._db) {
        await this._db.collection("entries").doc(id).delete();
        return;
      }
      this._local = this._local.filter(function (e) { return e.id !== id; });
      writeLocal(this._local);
      this._onChange(this._local.slice(), true);
    }
  };

  function readLocal() {
    try {
      var raw = localStorage.getItem("my-best-entries");
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function writeLocal(list) {
    try { localStorage.setItem("my-best-entries", JSON.stringify(list)); } catch (e) {}
  }

  /* ---------------- derived data ---------------- */
  function inPeriod(entry, period) {
    if (period === "all") return true;
    var d = new Date(entry.date + "T00:00:00");
    var now = new Date();
    if (period === "week") {
      var diff = (now - d) / 86400000;
      return diff >= 0 && diff < 7;
    }
    if (period === "month") {
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    }
    if (period === "year") {
      return d.getFullYear() === now.getFullYear();
    }
    return true;
  }

  function visibleEntries() {
    var list = (state.entries || []).filter(function (e) {
      return (state.filterType === "all" || e.type === state.filterType) && inPeriod(e, state.filterPeriod);
    });
    list.sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      return (b.date || "").localeCompare(a.date || "");
    });
    return list;
  }

  var SAMPLE = [
    { id: "s1", title: "君の名は。", type: "movie", date: todayStr(), score: 92, memo: "映像と音楽の一体感がすごい。", sample: true },
    { id: "s2", title: "人間失格", type: "book", date: todayStr(), score: 80, memo: "", sample: true },
    { id: "s3", title: "ゼルダの伝説", type: "game", date: todayStr(), score: 88, memo: "", sample: true },
    { id: "s4", title: "ゆっくり解説：宇宙の話", type: "youtube", date: todayStr(), score: 75, memo: "", sample: true },
    { id: "s5", title: "深夜食堂", type: "tv", date: todayStr(), score: 70, memo: "", sample: true }
  ];

  /* ---------------- render ---------------- */
  function render() {
    var app = document.getElementById("app");
    var loading = state.entries === null;
    var real = state.entries || [];
    var showSample = !loading && real.length === 0 && state.filterType === "all" && state.filterPeriod === "all";
    var list = showSample ? SAMPLE : visibleEntries();

    var count = real.length;
    var avg = count ? (real.reduce(function (s, e) { return s + (e.score || 0); }, 0) / count).toFixed(1) : "-";

    var html = "";
    html += '<header>';
    html += '<div class="title-row">';
    html += '<div class="app-name mincho">マイベスト</div>';
    html += '<div class="stats">記録 <b class="mono">' + count + '</b> 件<br>平均 <b class="mono">' + avg + '</b> 点</div>';
    html += '</div>';

    html += '<div class="chip-row">';
    html += '<div class="chip-group" data-group="type">';
    html += chipHtml("type", "all", "すべて", state.filterType === "all");
    html += chipHtml("type", "book", "本", state.filterType === "book");
    html += chipHtml("type", "movie", "映画", state.filterType === "movie");
    html += chipHtml("type", "youtube", "YouTube", state.filterType === "youtube");
    html += chipHtml("type", "tv", "テレビ番組", state.filterType === "tv");
    html += chipHtml("type", "game", "ゲーム", state.filterType === "game");
    html += chipHtml("type", "radio", "ラジオ", state.filterType === "radio");
    html += chipHtml("type", "other", "その他", state.filterType === "other");
    html += '</div>';
    html += '<div class="chip-divider"></div>';
    html += '<div class="chip-group" data-group="period">';
    html += chipHtml("period", "all", "全期間", state.filterPeriod === "all");
    html += chipHtml("period", "week", "1週間", state.filterPeriod === "week");
    html += chipHtml("period", "month", "今月", state.filterPeriod === "month");
    html += chipHtml("period", "year", "今年", state.filterPeriod === "year");
    html += '</div>';
    html += '</div>'; // chip-row
    html += '</header>';

    html += '<div class="list">';
    if (loading) {
      html += '<div class="empty-note">読み込み中…</div>';
    } else if (list.length === 0) {
      html += '<div class="empty-note">この条件に合う記録はまだありません。</div>';
    } else {
      if (showSample) {
        html += '<div class="empty-note">まだ記録がありません。右下の + から最初の作品を記録しましょう。<br>以下はイメージのサンプルです。</div>';
      }
      list.forEach(function (entry, i) {
        html += rowHtml(entry, i + 1, !!entry.sample);
      });
    }
    html += '</div>'; // list

    app.innerHTML = html;

    app.querySelectorAll(".chip").forEach(function (el) {
      el.addEventListener("click", function () {
        var group = el.getAttribute("data-group");
        var value = el.getAttribute("data-value");
        if (group === "type") state.filterType = value;
        else state.filterPeriod = value;
        render();
      });
    });
    app.querySelectorAll(".row").forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-id");
        if (id.indexOf("s") === 0 && SAMPLE.some(function (s) { return s.id === id; })) return;
        var entry = (state.entries || []).find(function (e) { return e.id === id; });
        if (entry) openSheet({ mode: "view", entry: entry });
      });
    });

    renderFab();
    renderSheet();
  }

  function chipHtml(group, value, label, pressed) {
    return '<button type="button" class="chip" data-group="' + group + '" data-value="' + value +
      '" aria-pressed="' + pressed + '">' + escapeHtml(label) + '</button>';
  }

  function rowHtml(entry, rank, isSample) {
    var t = TYPES[entry.type] || TYPES.book;
    var medal = rank <= 3 ? rank : "";
    var title = escapeHtml(entry.title || "無題");
    return (
      '<button type="button" class="row" data-id="' + entry.id + '">' +
      '<div class="rank mono"' + (medal ? ' data-medal="' + medal + '"' : "") + '>' + rank + "</div>" +
      '<div class="row-main">' +
      '<div class="row-title">' + title + (isSample ? '<span class="sample-tag">例</span>' : "") + "</div>" +
      '<div class="row-meta">' +
      '<span class="tag" data-type="' + entry.type + '">' + t.label + "</span>" +
      '<span class="row-date mono">' + escapeHtml(entry.date || "") + "</span>" +
      "</div></div>" +
      '<div class="row-score mono">' + (entry.score != null ? entry.score : "-") + "<span>/100</span></div>" +
      "</button>"
    );
  }

  function renderFab() {
    var old = document.querySelector(".fab");
    if (old) old.remove();
    var btn = document.createElement("button");
    btn.className = "fab";
    btn.type = "button";
    btn.setAttribute("aria-label", "作品を記録する");
    btn.textContent = "+";
    btn.addEventListener("click", function () {
      draft = { title: "", type: "book", date: todayStr(), score: 80, memo: "" };
      openSheet({ mode: "add" });
    });
    document.body.appendChild(btn);
  }

  /* ---------------- sheet (add/edit/view) ---------------- */
  function openSheet(cfg) {
    state.sheet = cfg;
    if (cfg.mode === "edit") {
      draft = {
        title: cfg.entry.title || "",
        type: cfg.entry.type || "book",
        date: cfg.entry.date || todayStr(),
        score: cfg.entry.score != null ? cfg.entry.score : 80,
        memo: cfg.entry.memo || ""
      };
    }
    renderSheet();
  }
  function closeSheet() {
    state.sheet = null;
    renderSheet();
  }

  function renderSheet() {
    var old = document.querySelector(".overlay");
    if (old) old.remove();
    if (!state.sheet) return;

    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) closeSheet();
    });

    var sheet = document.createElement("div");
    sheet.className = "sheet";
    sheet.addEventListener("click", function (e) { e.stopPropagation(); });

    if (state.sheet.mode === "view") {
      sheet.innerHTML = viewSheetHtml(state.sheet.entry, !!state.sheet.confirmDelete);
    } else {
      sheet.innerHTML = formSheetHtml(state.sheet.mode);
    }

    overlay.appendChild(sheet);
    document.body.appendChild(overlay);
    wireSheet(state.sheet.mode, state.sheet.entry);
  }

  function viewSheetHtml(entry, confirmDelete) {
    var t = TYPES[entry.type] || TYPES.book;
    var actions;
    if (confirmDelete) {
      actions =
        '<div class="banner" style="color:var(--danger);">本当に削除しますか？この操作は取り消せません。</div>' +
        '<div class="sheet-actions">' +
        '<button type="button" class="btn btn-ghost" data-act="cancel-delete">キャンセル</button>' +
        '<button type="button" class="btn btn-danger" data-act="confirm-delete" style="flex:1;background:var(--danger);color:var(--accent-ink);border:none;">削除する</button>' +
        "</div>";
    } else {
      actions =
        '<div class="sheet-actions">' +
        '<button type="button" class="btn btn-ghost" data-act="close">閉じる</button>' +
        '<button type="button" class="btn btn-ghost" data-act="edit">編集</button>' +
        '<button type="button" class="btn btn-danger" data-act="delete">削除</button>' +
        "</div>";
    }
    return (
      '<div class="sheet-handle"></div>' +
      '<div class="sheet-title">' + escapeHtml(entry.title || "無題") + "</div>" +
      '<div class="row-meta" style="margin-bottom:14px;">' +
      '<span class="tag" data-type="' + entry.type + '">' + t.label + "</span>" +
      '<span class="row-date mono">' + escapeHtml(entry.date || "") + "</span>" +
      '<span class="mono" style="margin-left:auto;font-weight:700;color:var(--accent);font-size:1.1rem;">' + entry.score + '<span style="font-size:0.68rem;color:var(--ink-faint);">/100</span></span>' +
      "</div>" +
      '<div class="detail-memo">' + (entry.memo ? escapeHtml(entry.memo) : "メモはありません") + "</div>" +
      actions
    );
  }

  function formSheetHtml(mode) {
    var title = mode === "edit" ? "記録を編集" : "作品を記録";
    var typeButtons = Object.keys(TYPES).map(function (key) {
      return '<button type="button" class="type-btn" data-type="' + key + '" aria-pressed="' + (draft.type === key) + '">' + TYPES[key].label + "</button>";
    }).join("");
    var presets = [50, 70, 80, 90, 100];
    var presetButtons = presets.map(function (p) {
      return '<button type="button" class="score-preset mono" data-preset="' + p + '">' + p + "</button>";
    }).join("");
    return (
      '<div class="sheet-handle"></div>' +
      '<div class="sheet-title">' + title + "</div>" +
      (state.usingFallback ? '<div class="banner">この端末にのみ保存されます（同期は利用できません）</div>' : "") +
      '<div class="field"><label for="f-title">タイトル</label>' +
      '<input type="text" id="f-title" placeholder="例）君の名は。" value="' + escapeHtml(draft.title) + '"></div>' +
      '<div class="field"><label>種類</label><div class="type-select">' + typeButtons + "</div></div>" +
      '<div class="field"><label for="f-date">観た日</label>' +
      '<input type="date" id="f-date" value="' + draft.date + '"></div>' +
      '<div class="field"><label for="f-score">点数（100点満点）</label>' +
      '<div class="score-field"><div class="score-readout mono" id="f-score-readout">' + draft.score + '<span>/100</span></div>' +
      '<input type="range" id="f-score" min="0" max="100" step="1" value="' + draft.score + '"></div>' +
      '<div class="score-presets">' + presetButtons + "</div></div>" +
      '<div class="field"><label for="f-memo">メモ（任意）</label>' +
      '<textarea id="f-memo" placeholder="感想や覚えておきたいことを書いておこう">' + escapeHtml(draft.memo) + "</textarea></div>" +
      '<div class="sheet-actions">' +
      '<button type="button" class="btn btn-ghost" data-act="cancel">キャンセル</button>' +
      '<button type="button" class="btn btn-primary" data-act="save">保存する</button>' +
      "</div>"
    );
  }

  function wireSheet(mode, entry) {
    var sheet = document.querySelector(".sheet");
    if (!sheet) return;

    if (mode === "view") {
      var closeBtn = sheet.querySelector('[data-act="close"]');
      if (closeBtn) closeBtn.addEventListener("click", closeSheet);
      var editBtn = sheet.querySelector('[data-act="edit"]');
      if (editBtn) editBtn.addEventListener("click", function () {
        openSheet({ mode: "edit", entry: entry });
      });
      var deleteBtn = sheet.querySelector('[data-act="delete"]');
      if (deleteBtn) deleteBtn.addEventListener("click", function () {
        state.sheet.confirmDelete = true;
        renderSheet();
      });
      var cancelDeleteBtn = sheet.querySelector('[data-act="cancel-delete"]');
      if (cancelDeleteBtn) cancelDeleteBtn.addEventListener("click", function () {
        state.sheet.confirmDelete = false;
        renderSheet();
      });
      var confirmDeleteBtn = sheet.querySelector('[data-act="confirm-delete"]');
      if (confirmDeleteBtn) confirmDeleteBtn.addEventListener("click", async function () {
        confirmDeleteBtn.disabled = true;
        confirmDeleteBtn.textContent = "削除中…";
        try {
          await store.remove(entry.id);
          closeSheet();
        } catch (e) {
          confirmDeleteBtn.disabled = false;
          confirmDeleteBtn.textContent = "削除する";
          showBanner(sheet, "削除に失敗しました。もう一度お試しください。");
        }
      });
      return;
    }

    var titleInput = sheet.querySelector("#f-title");
    var dateInput = sheet.querySelector("#f-date");
    var memoInput = sheet.querySelector("#f-memo");
    titleInput.addEventListener("input", function () { draft.title = titleInput.value; });
    dateInput.addEventListener("input", function () { draft.date = dateInput.value; });
    memoInput.addEventListener("input", function () { draft.memo = memoInput.value; });

    sheet.querySelectorAll(".type-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        draft.type = btn.getAttribute("data-type");
        sheet.querySelectorAll(".type-btn").forEach(function (b) {
          b.setAttribute("aria-pressed", b === btn);
        });
      });
    });
    var scoreInput = sheet.querySelector("#f-score");
    var scoreReadout = sheet.querySelector("#f-score-readout");
    scoreInput.addEventListener("input", function () {
      draft.score = parseInt(scoreInput.value, 10);
      scoreReadout.innerHTML = draft.score + "<span>/100</span>";
    });
    sheet.querySelectorAll(".score-preset").forEach(function (btn) {
      btn.addEventListener("click", function () {
        draft.score = parseInt(btn.getAttribute("data-preset"), 10);
        scoreInput.value = draft.score;
        scoreReadout.innerHTML = draft.score + "<span>/100</span>";
      });
    });

    sheet.querySelector('[data-act="cancel"]').addEventListener("click", closeSheet);
    sheet.querySelector('[data-act="save"]').addEventListener("click", async function () {
      var title = draft.title.trim();
      if (!title) { titleInput.focus(); return; }
      var saveBtn = sheet.querySelector('[data-act="save"]');
      saveBtn.disabled = true;
      saveBtn.textContent = "保存中…";
      var payload = {
        title: title,
        type: draft.type,
        date: draft.date || todayStr(),
        score: draft.score,
        memo: draft.memo.trim()
      };
      try {
        if (mode === "edit") {
          await store.update(state.sheet.entry.id, payload);
        } else {
          await store.add(payload);
        }
        closeSheet();
      } catch (e) {
        saveBtn.disabled = false;
        saveBtn.textContent = "保存する";
        showBanner(sheet, "保存に失敗しました。もう一度お試しください。");
      }
    });
  }

  function showBanner(sheet, message) {
    var old = sheet.querySelector(".inline-banner");
    if (old) old.remove();
    var el = document.createElement("div");
    el.className = "banner inline-banner";
    el.style.color = "var(--danger)";
    el.textContent = message;
    var titleEl = sheet.querySelector(".sheet-title");
    titleEl.insertAdjacentElement("afterend", el);
  }

  /* ---------------- boot ---------------- */
  function boot() {
    render();
    store.init(function (list) {
      state.entries = list;
      // keep an open sheet in sync (e.g. after fallback local write)
      if (state.sheet && state.sheet.mode === "view") {
        var fresh = list.find(function (e) { return e.id === state.sheet.entry.id; });
        if (fresh) state.sheet.entry = fresh;
        else state.sheet = null;
      }
      render();
    });
  }

  if (window.claude && window.claude.hot) {
    var ready = window.claude.hot.ready;
    if (ready) ready(boot); else boot();
  } else {
    boot();
  }
})();
</script>
